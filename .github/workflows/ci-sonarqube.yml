name: sonarqube scan
on:
  workflow_call:
jobs:
  code-test:
    runs-on: ubuntu-latest
    steps:
      - name: code-checkout
        uses: actions/checkout@v7
        with:
# Disabling shallow clones is recommended for improving the relevancy of reporting

          fetch-depth: 0
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=nishantbhangale
            -Dsonar.projectKey=NishantBhangale_tws-devboard
            -Dsonar.sources=backend,frontend
            -Dsonar.qualitygate.wait=true

# 3. Setup Python for report generation

      - name: Setup Python
        if: always()
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

# 4. Generate actual SonarCloud HTML report

      - name: Generate SonarCloud HTML Report
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: NishantBhangale_tws-devboard
          GITHUB_BRANCH: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p reports
          python .github/scripts/generate_sonar_report.py

# 5. Upload HTML report

      - name: Upload SonarCloud HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devboard-sonarcloud-html-report
          path: reports/sonarcloud-report.html
          if-no-files-found: error
          retention-days: 30

# 6. Display report location

      - name: Report information
        if: always()
        run: |
          echo "SonarCloud Dashboard:"
          echo "https://sonarcloud.io/dashboard?id=NishantBhangale_tws-devboard"
          echo "HTML report uploaded as GitHub Actions artifact."