name: dependency-scan
on:
  workflow_call:
jobs:
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - name: code-checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: audit packages
        run: npm audit >> npm_report.json
        working-directory: frontend
      - name: 'Upload Artifact frontend'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-artifacts_frontend
          path: frontend/npm_report.json
          retention-days: 5
      - name: setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./backend/go.mod
          cache: true
          cache-dependency-path: go.sum
      - id: govulncheck

# Continue-on-error : true

        uses: golang/govulncheck-action@v1
        with:
          work-dir: backend
          repo-checkout: false
          output-format: json
          output-file: report.json
      - name: 'Upload Artifact Backend report'
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-artifacts_backend
          path: report.json
          retention-days: 5