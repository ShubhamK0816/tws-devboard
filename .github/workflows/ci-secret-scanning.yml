name: ci-secret-scanning
on:
    workflow_call:
jobs:
    secret-scanning:
        runs-on: ubuntu-latest
        steps:
            - name: code-checkout
              uses: actions/checkout@v7
              with:
                fetch-depth: 0
            - name: secret-scanning
              uses: gitleaks/gitleaks-action@v3
              env:
                GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'