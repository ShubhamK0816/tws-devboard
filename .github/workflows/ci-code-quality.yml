name: ci-code-quality
on:
  workflow_call:
jobs:
  SAST:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

# Backend code quality checks

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: ./backend/go.mod
          check-latest: false
          cache: true
          cache-dependency-path: ./backend/go.mod
      - name: Check formatting (gofmt)
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following Go files are not properly formatted:"
            gofmt -l .
            exit 1
          fi
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13
      
# Frontend code quality checks

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint code
        run: npm run lint
      - name: Build project
        run: npm run build